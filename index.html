<!doctype html>
<html lang="zh-CN" class="dark zhiliaocity-force-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 强制深色：WebView 首帧即深色，避免 Capacitor 首帧白屏/浅色闪烁 -->
    <meta name="theme-color" content="#131616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#131616" />
    <script>
      // 在 React 挂载前强制根元素切到 dark：
      //   1) 写 .dark → 配合 index.css 中的 @custom-variant dark (&:where(.dark, .dark *)) 让 Tailwind dark:* 类生效（class 策略，不跟系统走）
      //   2) 写 .zhiliaocity-force-dark → 配合 index.css 末尾的硬兜底：把 .paper-light/.bg-white/.text-slate-800 等浅色类也渲染成深色，
      //      解决组件内写了 `theme==='light' ? 'bg-paper-light text-slate-800' : 'bg-paper-dark text-slate-100'`，
      //      但首帧 theme 状态/逻辑慢一拍导致 Capacitor WebView 露纸白/浅色文字的问题。
      // 知了城市要求：永远默认深色进入，所以不回退 localStorage 的浅色选择。
      (function () {
        try {
          var root = document.documentElement;
          root.classList.add('dark');
          root.classList.add('zhiliaocity-force-dark');
          root.classList.remove('light');
          root.style.colorScheme = 'dark';
        } catch (e) {}
      })();
    </script>
    <title>知了城市</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      /* 在 Vite 注入 CSS 前先给出一致的墨黑底色，避免 WebView 白闪 */
      html, body { background: #131616 !important; color: #CBD5E1 !important; margin: 0; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
